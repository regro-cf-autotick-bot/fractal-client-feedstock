{% set python_min = "3.11.0" %}
{% set name = "fractal-client" %}
{% set version = "2.24.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/fractal_client-{{ version }}.tar.gz
  sha256: 42dd2538edb88c313903925fa4e5d31e38bcc023081d89a90eb72abc10c0ab27

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  entry_points:
    - fractal = fractal_client.client:main
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=80.0
    - pip
  run:
    - httpx2 >=2.12.0,<2.13.0
    - python >={{ python_min }},<3.14.0
    - python-dotenv >=1.2.0,<1.3.0
    - httpx >=0.28.0,<0.29.0
    - pyjwt >=2.15.0,<3.0.0
    - packaging >=26.0.0,<27.0.0

test:
  imports:
    - fractal_client
  commands:
    - pip check
    - fractal --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/fractal-analytics-platform/fractal-client
  summary: Client component of the Fractal analytics platform
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ychiucco
    - jluethi
    - mfranzon
    - tcompa
